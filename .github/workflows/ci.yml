name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install

      - name: Type-check
        run: bun run typecheck

      - name: Testes
        run: bun run test

      - name: Build
        run: bun run build
